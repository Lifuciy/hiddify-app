name: PXY Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/sha)"
        required: true
        default: "pxy/activation-only"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Fetch submodules via HTTPS (if any)
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://github.com/"
          if [ -f .gitmodules ]; then
            sed -i 's#ssh://git@github.com/#https://github.com/#g' .gitmodules
            sed -i 's#git@github.com:#https://github.com/#g' .gitmodules
            git submodule sync --recursive || true
            git submodule update --init --recursive
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Pack release to zip
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $zip = "pxy-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          Get-ChildItem $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows
          path: pxy-windows.zip
