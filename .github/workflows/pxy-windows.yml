name: PXY Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/sha)"
        required: true
        default: "pxy/activation-only"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Fetch submodules (level-by-level, force HTTPS)
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://github.com/"

          fix_file () {
            local f="$1"
            [ -f "$f" ] || return 0
            sed -i 's#ssh://git@github.com/#https://github.com/#g' "$f"
            sed -i 's#ssh://github.com/#https://github.com/#g' "$f"
            sed -i 's#git@github.com:#https://github.com/#g' "$f"
            sed -i 's#git@github.com/#https://github.com/#g' "$f"
          }

          fix_file .gitmodules
          git submodule sync --recursive || true
          git submodule update --init hiddify-core

          fix_file hiddify-core/.gitmodules
          (cd hiddify-core && git submodule sync --recursive || true && git submodule update --init)

          fix_file hiddify-core/hiddify-sing-box/.gitmodules
          if [ -d hiddify-core/hiddify-sing-box ]; then
            (cd hiddify-core/hiddify-sing-box && git submodule sync --recursive || true && git submodule update --init)
          fi

          while IFS= read -r -d '' gm; do fix_file "$gm"; done < <(find . -name .gitmodules -print0)
          git submodule sync --recursive || true
          git submodule update --init --recursive

      - name: Setup Go (for hiddify-core)
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Setup MSYS2 (gcc for cgo)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Add gcc to PATH
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version

      - name: Build hiddify-core.dll (try main packages)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (!(Test-Path "hiddify-core\bin")) { New-Item -ItemType Directory -Force -Path "hiddify-core\bin" | Out-Null }

          Push-Location hiddify-core
          $env:CGO_ENABLED = "1"
          $env:CC = "gcc"

          $pkgs = @(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./... | Where-Object { $_ -and $_.Trim() -ne "" })
          if ($LASTEXITCODE -ne 0) { throw "go list failed" }

          $ordered = $pkgs | Sort-Object `
            @{Expression={ if ($_ -match 'dll|lib') {0} elseif ($_ -match 'core|hiddify') {1} else {2} }}, `
            @{Expression={ $_ }}

          $ok = $false
          foreach ($pkg in $ordered) {
            Remove-Item -Force -ErrorAction SilentlyContinue "bin\hiddify-core.dll","bin\hiddify-core.h"
            go build -buildmode=c-shared -o "bin\hiddify-core.dll" $pkg
            if ($LASTEXITCODE -eq 0 -and (Test-Path "bin\hiddify-core.dll")) { $ok=$true; break }
          }
          Pop-Location

          if (-not $ok) { throw "No main package could build c-shared DLL" }
          if (!(Test-Path "hiddify-core\bin\hiddify-core.dll")) { throw "hiddify-core.dll not created" }

      - name: Force required bin files to exist (avoid cmake install fail)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "hiddify-core\bin"
          if (!(Test-Path $bin)) { New-Item -ItemType Directory -Force -Path $bin | Out-Null }
          $need = @("HiddifyCli.exe","libcronet.dll")
          foreach ($f in $need) {
            $p = Join-Path $bin $f
            if (Test-Path $p) {
              $it = Get-Item $p -Force
              if ($it.PSIsContainer) { Remove-Item $p -Recurse -Force }
            }
            if (!(Test-Path $p)) { New-Item -ItemType File -Path $p -Force | Out-Null }
          }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        shell: pwsh
        run: |
          flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath build_windows.log

      - name: Create start scripts (white screen workaround)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "build\windows\x64\runner\Release"
          if (!(Test-Path $out)) { throw "Release dir not found: $out" }
          $exe = (Get-ChildItem $out -Filter *.exe | Select-Object -First 1).Name
          if (-not $exe) { throw "No exe in $out" }

          @'
@echo off
cd /d %~dp0
start "" "%~dp0__EXE__" --disable-impeller --enable-software-rendering
'@.Replace("__EXE__", $exe) | Set-Content -Encoding ASCII -Path (Join-Path $out "run_start.bat")

          @'
@echo off
cd /d %~dp0
"%~dp0__EXE__" --disable-impeller --enable-software-rendering
pause
'@.Replace("__EXE__", $exe) | Set-Content -Encoding ASCII -Path (Join-Path $out "run_safe.bat")

      - name: Pack release to zip
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (!(Test-Path $src)) { $src = "build/windows/runner/Release" }
          $zip = "pxy-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          Get-ChildItem $zip

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows
          path: pxy-windows.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows-build-log
          path: build_windows.log
          if-no-files-found: warn
