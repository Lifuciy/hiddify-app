name: PXY Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/sha)"
        required: true
        default: "pxy/activation-only"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Fetch submodules (level-by-level, force HTTPS)
        shell: bash
        run: |
          set -euo pipefail

          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://github.com/"

          fix_file () {
            local f="$1"
            [ -f "$f" ] || return 0
            sed -i 's#ssh://git@github.com/#https://github.com/#g' "$f"
            sed -i 's#ssh://github.com/#https://github.com/#g' "$f"
            sed -i 's#git@github.com:#https://github.com/#g' "$f"
            sed -i 's#git@github.com/#https://github.com/#g' "$f"
          }

          fix_file .gitmodules
          git submodule sync --recursive || true

          git submodule update --init hiddify-core

          fix_file hiddify-core/.gitmodules
          (cd hiddify-core && git submodule sync --recursive || true && git submodule update --init)

          fix_file hiddify-core/hiddify-sing-box/.gitmodules
          if [ -d hiddify-core/hiddify-sing-box ]; then
            (cd hiddify-core/hiddify-sing-box && git submodule sync --recursive || true && git submodule update --init)
          fi

          while IFS= read -r -d '' gm; do
            fix_file "$gm"
          done < <(find . -name .gitmodules -print0)

          git submodule sync --recursive || true
          git submodule update --init --recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release, short build dir)
        shell: pwsh
        run: |
          flutter build windows --release --build-dir bld --verbose 2>&1 | Tee-Object -FilePath build_windows.log

      - name: Pack release to zip
        if: success()
        shell: pwsh
        run: |
          $src = "bld/windows/x64/runner/Release"
          if (!(Test-Path $src)) { $src = "bld/windows/runner/Release" }
          $zip = "pxy-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          Get-ChildItem $zip

      - name: Upload artifact (zip)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows
          path: pxy-windows.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows-build-log
          path: build_windows.log
