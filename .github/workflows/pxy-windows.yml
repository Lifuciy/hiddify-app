name: PXY Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/sha)"
        required: true
        default: "pxy/activation-only"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Fetch submodules (level-by-level, force HTTPS)
        shell: bash
        run: |
          set -euo pipefail

          # глобальная подмена GitHub SSH -> HTTPS
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://github.com/"

          fix_file () {
            local f="$1"
            [ -f "$f" ] || return 0
            sed -i 's#ssh://git@github.com/#https://github.com/#g' "$f"
            sed -i 's#ssh://github.com/#https://github.com/#g' "$f"
            sed -i 's#git@github.com:#https://github.com/#g' "$f"
            sed -i 's#git@github.com/#https://github.com/#g' "$f"
          }

          # ROOT
          fix_file .gitmodules
          git submodule sync --recursive || true

          # Level 1: только hiddify-core
          git submodule update --init hiddify-core

          # Level 2: правим .gitmodules внутри core и тянем его прямые сабмодули
          fix_file hiddify-core/.gitmodules
          (cd hiddify-core && git submodule sync --recursive || true && git submodule update --init)

          # Level 3: если есть sing-box — правим и тянем его replace/*
          fix_file hiddify-core/hiddify-sing-box/.gitmodules
          if [ -d hiddify-core/hiddify-sing-box ]; then
            (cd hiddify-core/hiddify-sing-box && git submodule sync --recursive || true && git submodule update --init)
          fi

          # Final: добиваем всё рекурсивно
          while IFS= read -r -d '' gm; do
            fix_file "$gm"
          done < <(find . -name .gitmodules -print0)

          git submodule sync --recursive || true
          git submodule update --init --recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Pack release to zip
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (!(Test-Path $src)) { $src = "build/windows/runner/Release" }
          $zip = "pxy-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          Get-ChildItem $zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows
          path: pxy-windows.zip
