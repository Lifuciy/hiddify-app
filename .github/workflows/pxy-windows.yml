name: PXY Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/sha)"
        required: true
        default: "pxy/activation-only"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout (no submodules in checkout)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Enable long paths (Windows)
        shell: pwsh
        run: |
          git config --system core.longpaths true
          reg add HKLM\SYSTEM\CurrentControlSet\Control\FileSystem /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Fetch submodules (force HTTPS)
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://github.com/".insteadOf "ssh://github.com/"

          if [ -f .gitmodules ]; then
            sed -i 's#ssh://git@github.com/#https://github.com/#g' .gitmodules
            sed -i 's#git@github.com:#https://github.com/#g' .gitmodules
          fi
          git submodule sync --recursive || true
          git submodule update --init --recursive || true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Ensure core bin placeholders (avoid cmake install fails)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $bin = "hiddify-core\bin"
          if (!(Test-Path $bin)) { New-Item -ItemType Directory -Force -Path $bin | Out-Null }
          $need = @("hiddify-core.dll","HiddifyCli.exe","libcronet.dll")
          foreach ($f in $need) {
            $p = Join-Path $bin $f
            if (Test-Path $p) {
              $it = Get-Item $p -Force
              if ($it.PSIsContainer) { Remove-Item $p -Recurse -Force }
            }
            if (!(Test-Path $p)) { New-Item -ItemType File -Path $p -Force | Out-Null }
          }
          Get-ChildItem $bin -Force | Select-Object Name,Length

      - name: Build Windows (release)
        shell: pwsh
        run: |
          flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath build_windows.log

      - name: Create start scripts (white screen workaround)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "build\windows\x64\runner\Release"
          if (!(Test-Path $out)) { $out = "build\windows\runner\Release" }
          if (!(Test-Path $out)) { throw "Release dir not found" }

          $exe = (Get-ChildItem $out -Filter *.exe | Select-Object -First 1).Name
          if (-not $exe) { throw "No exe found" }

          @'
@echo off
cd /d %~dp0
start "" "%~dp0__EXE__" --disable-impeller --enable-software-rendering
'@.Replace("__EXE__", $exe) | Set-Content -Encoding ASCII -Path (Join-Path $out "run_start.bat")

          @'
@echo off
cd /d %~dp0
"%~dp0__EXE__" --disable-impeller --enable-software-rendering
pause
'@.Replace("__EXE__", $exe) | Set-Content -Encoding ASCII -Path (Join-Path $out "run_safe.bat")

      - name: Pack release to zip
        shell: pwsh
        run: |
          $src = "build\windows\x64\runner\Release"
          if (!(Test-Path $src)) { $src = "build\windows\runner\Release" }
          $zip = "pxy-windows.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$src\*" -DestinationPath $zip
          Get-ChildItem $zip

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows
          path: pxy-windows.zip
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows-build-log
          path: build_windows.log
          if-no-files-found: warn
