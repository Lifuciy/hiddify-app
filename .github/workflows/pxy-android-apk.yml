name: PXY Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/sha)"
        required: true
        default: "pxy/activation-only"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (no submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Fetch submodules (level-by-level, force HTTPS)
        shell: bash
        run: |
          set -euo pipefail

          # Global rewrite: any GitHub SSH-style URL -> HTTPS
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://github.com/"

          fix_file () {
            local f="$1"
            [ -f "$f" ] || return 0
            sed -i 's#ssh://git@github.com/#https://github.com/#g' "$f"
            sed -i 's#ssh://github.com/#https://github.com/#g' "$f"
            sed -i 's#git@github.com:#https://github.com/#g' "$f"
            sed -i 's#git@github.com/#https://github.com/#g' "$f"
          }

          # ROOT: rewrite + sync
          fix_file .gitmodules
          git submodule sync --recursive || true

          # Level 1: clone only hiddify-core
          git submodule update --init hiddify-core

          # Level 2: rewrite hiddify-core/.gitmodules then init its direct submodules (sing-box, ray2sing, etc)
          fix_file hiddify-core/.gitmodules
          (cd hiddify-core && git submodule sync --recursive || true && git submodule update --init)

          # Level 3: rewrite sing-box .gitmodules then init its direct submodules (replace/*)
          fix_file hiddify-core/hiddify-sing-box/.gitmodules
          (cd hiddify-core/hiddify-sing-box && git submodule sync --recursive || true && git submodule update --init)

          # Final pass: rewrite ANY remaining .gitmodules and fully recurse
          while IFS= read -r -d '' gm; do
            fix_file "$gm"
          done < <(find . -name .gitmodules -print0)

          git submodule sync --recursive || true
          git submodule update --init --recursive

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y make unzip curl

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Android deps via make
        run: make android-aab-install-deps

      - name: Android prepare (libs/core)
        run: |
          make android-aab-prepare
          make android-aab-libs

      - name: Build AAB (release)
        run: make android-aab-release

      - name: Convert AAB -> universal APK (installable)
        run: |
          AAB="$(find build -type f -name '*.aab' | head -n 1)"
          echo "AAB=$AAB"
          test -n "$AAB"

          curl -L -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar

          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          java -jar bundletool.jar build-apks \
            --bundle "$AAB" \
            --output app.apks \
            --mode=universal \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android

          unzip -p app.apks universal.apk > app-universal.apk
          ls -la app-universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pxy-android-apk
          path: app-universal.apk
