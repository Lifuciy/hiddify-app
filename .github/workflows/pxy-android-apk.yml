name: PXY Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch/tag/sha)"
        required: true
        default: "pxy/activation-only"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y make unzip curl

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Android prepare (libs/core)
        run: |
          make android-aab-prepare
          make android-aab-libs

      - name: Build AAB (release)
        run: make android-aab-release

      - name: Convert AAB -> universal APK (installable)
        run: |
          AAB="$(find build -type f -name '*.aab' | head -n 1)"
          echo "AAB=$AAB"
          test -n "$AAB"

          curl -L -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.0/bundletool-all-1.17.0.jar

          # generate local keystore for signing apks
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          java -jar bundletool.jar build-apks \
            --bundle "$AAB" \
            --output app.apks \
            --mode=universal \
            --ks debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android

          unzip -p app.apks universal.apk > app-universal.apk
          ls -la app-universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pxy-android-apk
          path: app-universal.apk
