name: PXY Windows (Stable)

"on":
  workflow_dispatch:
    inputs:
      pxy_activation_url:
        description: "PXY activation API URL"
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init build status
        run: |
          "BUILD_FAILED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_REACHED=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Force HTTPS for submodules
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: false

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hiddify-core/go.mod
          cache: true
          cache-dependency-path: hiddify-core/go.sum

      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Build hiddify-core binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $gccCmd = Get-Command gcc.exe -ErrorAction Stop
          $env:CC = $gccCmd.Source
          $mingwBin = Split-Path $env:CC
          $env:PATH = "$mingwBin;$env:PATH"
          Write-Host "Using GCC: $env:CC"

          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "1"

          New-Item -ItemType Directory -Force "hiddify-core\bin" | Out-Null
          Push-Location "hiddify-core"

          Remove-Item -Force -ErrorAction SilentlyContinue "bin\hiddify-core.dll","bin\HiddifyCli.exe"

          $env:CGO_LDFLAGS = ""
          go build -v -trimpath -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc" -ldflags="-w -s" -buildmode=c-shared -o "bin\hiddify-core.dll" ./platform/desktop
          if ($LASTEXITCODE -ne 0) { throw "failed to build hiddify-core.dll" }
          if (!(Test-Path "bin\hiddify-core.dll")) { throw "bin\hiddify-core.dll was not created" }

          go install github.com/akavel/rsrc@latest
          if ($LASTEXITCODE -ne 0) { throw "failed to install rsrc" }

          rsrc -ico ".\assets\hiddify-cli.ico" -o "cmd\bydll\cli.syso"
          if ($LASTEXITCODE -ne 0) { throw "failed to generate cmd\bydll\cli.syso" }

          Copy-Item "bin\hiddify-core.dll" ".\hiddify-core.dll" -Force
          $env:CGO_LDFLAGS = "hiddify-core.dll"
          go build -v -trimpath -ldflags="-w -s" -o "bin\HiddifyCli.exe" ./cmd/bydll/
          if ($LASTEXITCODE -ne 0) { throw "failed to build HiddifyCli.exe" }
          Remove-Item ".\hiddify-core.dll" -Force
          if (!(Test-Path "bin\HiddifyCli.exe")) { throw "bin\HiddifyCli.exe was not created" }

          Get-ChildItem "bin" -Force
          Pop-Location

      - name: Build Windows (capture log)
        id: build_win
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          "BUILD_REACHED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $defineArgs = @()
$defineArgs += "--dart-define=PXY_ACCOUNT_API_URL=https://api.marakastaraka.ru"
          if ("${{ inputs.pxy_activation_url }}" -ne "") {
            $defineArgs += "--dart-define=PXY_ACTIVATION_URL=${{ inputs.pxy_activation_url }}"
          }
          flutter build windows --release @defineArgs 2>&1 | Tee-Object -FilePath build_windows.log
          if ($LASTEXITCODE -ne 0) {
            "BUILD_FAILED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "BUILD_FAILED=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Package (always)
        if: always()
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null

          # put launchers into dist
          if (Test-Path "ci\windows\run_start.bat") { Copy-Item "ci\windows\run_start.bat" "dist\run_start.bat" -Force }
          if (Test-Path "ci\windows\run_safe.bat")  { Copy-Item "ci\windows\run_safe.bat"  "dist\run_safe.bat"  -Force }

          $releaseDir = "build\windows\x64\runner\Release"
          if (Test-Path $releaseDir) {
            Copy-Item -Recurse -Force "$releaseDir\*" "dist\"

            foreach ($runtimeFile in @("hiddify-core.dll", "HiddifyCli.exe")) {
              $runtimePath = Join-Path "hiddify-core\bin" $runtimeFile
              if (Test-Path $runtimePath) {
                Copy-Item $runtimePath "dist\$runtimeFile" -Force
              }
            }

            foreach ($required in @("hiddify-core.dll", "HiddifyCli.exe")) {
              $requiredPath = Join-Path "dist" $required
              if (!(Test-Path $requiredPath) -or ((Get-Item $requiredPath).Length -eq 0)) {
                throw "Required runtime file is missing or empty in artifact: $required"
              }
            }

            Set-Content -Path "dist\README.txt" -Value "ok"
          } else {
            "BUILD_FAILED=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Set-Content -Path "dist\README.txt" -Value "build failed - release dir not found - see build_windows.log"
          }

          # ensure Flutter runtime dll is packaged
          if ($env:BUILD_FAILED -eq "0") {
            if (!(Test-Path "dist\flutter_windows.dll")) {
              $fw = Get-ChildItem -Path "build\windows\x64" -Recurse -Filter "flutter_windows.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($fw) { Copy-Item $fw.FullName "dist\flutter_windows.dll" -Force }
            }

            if (!(Test-Path "dist\flutter_windows.dll")) {
              $engineDll = Join-Path $env:FLUTTER_ROOT "bin\cache\artifacts\engine\windows-x64-release\flutter_windows.dll"
              if (Test-Path $engineDll) { Copy-Item $engineDll "dist\flutter_windows.dll" -Force }
            }

            if (!(Test-Path "dist\flutter_windows.dll")) { throw "flutter_windows.dll not found in build output or Flutter SDK" }

            if (!(Test-Path "dist\data")) {
              New-Item -ItemType Directory -Force "dist\data" | Out-Null
            }

            if (!(Test-Path "dist\data\icudtl.dat")) {
              $icu = Get-ChildItem -Path "build\windows\x64" -Recurse -Filter "icudtl.dat" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($icu) { Copy-Item $icu.FullName "dist\data\icudtl.dat" -Force }
            }

            if (!(Test-Path "dist\data\icudtl.dat")) {
              $engineDir = Join-Path $env:FLUTTER_ROOT "bin\cache\artifacts\engine"
              $icu = Get-ChildItem -Path $engineDir -Recurse -Filter "icudtl.dat" -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($icu) { Copy-Item $icu.FullName "dist\data\icudtl.dat" -Force }
            }

            if (!(Test-Path "dist\data\icudtl.dat")) {
              throw "icudtl.dat not found in build output or Flutter SDK"
            }
          }

          if (Test-Path "build_windows.log") { Copy-Item "build_windows.log" "dist\build_windows.log" -Force }

          Compress-Archive -Path dist\* -DestinationPath pxy-windows.zip -Force
          if (!(Test-Path pxy-windows.zip)) { throw "zip not created" }

      - name: Upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pxy-windows
          path: pxy-windows.zip

      - name: Fail job if build failed (after artifact)
        if: always()
        run: |
          if ($env:BUILD_REACHED -ne "1") { throw "Build Windows step was not reached (artifact uploaded with logs)" }
          if ($env:BUILD_FAILED -ne "0") { throw "Build failed (artifact uploaded with logs)" }
